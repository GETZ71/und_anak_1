<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Dark Invitation | Digital Business Template</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,700;1,900&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- AOS for Scroll Animations -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        :root {
            --primary-dark: #0f172a; /* Deep Slate Blue */
            --accent-color: #f59e0b; /* Amber Gold */
            --text-light: #f8fafc;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --card-inner: rgba(30, 41, 59, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--primary-dark);
            color: var(--text-light);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* --- Custom Scrollbar --- */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: var(--primary-dark); }
        ::-webkit-scrollbar-thumb { background: var(--accent-color); border-radius: 10px; }

        /* --- Unboxing Overlay --- */
        #unboxing-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #1e293b, #0f172a);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            transition: 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .envelope-wrapper {
            position: relative;
            cursor: pointer;
            text-align: center;
        }

        .envelope-icon {
            font-size: 5rem;
            color: var(--accent-color);
            filter: drop-shadow(0 0 15px rgba(245, 158, 11, 0.5));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        /* --- Music Toggle --- */
        .music-control {
            position: fixed;
            bottom: 25px;
            left: 20px;
            z-index: 1000;
            cursor: pointer;
            display: none;
        }

        .music-btn {
            width: 45px;
            height: 45px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--accent-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--accent-color);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            backdrop-filter: blur(5px);
        }

        .rotate {
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* --- Hero Section --- */
        section {
            padding: 80px 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.85)),
                        var(--hero-img) no-repeat center center/cover;
        }

        .hero-badge {
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            margin-bottom: 10px;
        }

        .hero .highlight {
            color: var(--accent-color);
            font-style: italic;
        }

        /* --- Glass Card Style --- */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px 30px;
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
        }

        .section-title {
            text-align: center;
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .section-title::before, .section-title::after {
            content: '';
            height: 1px;
            width: 40px;
            background: var(--accent-color);
        }

        /* --- Info Grid --- */
        .event-box {
            background: var(--card-inner);
            border-left: 3px solid var(--accent-color);
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 0 15px 15px 0;
        }

        .event-box h3 {
            font-size: 0.8rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        /* --- Gallery Grid --- */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 20px;
        }

        .gallery-item {
            aspect-ratio: 1/1;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.5s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.1);
        }

        /* --- Digital Gift Section --- */
        .gift-box {
            text-align: center;
            padding: 25px;
            background: rgba(245, 158, 11, 0.05);
            border-radius: 20px;
            border: 1px dashed var(--accent-color);
        }

        /* --- RSVP & Form Styles --- */
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            color: var(--accent-color);
            margin-bottom: 5px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            background: rgba(255,255,255,0.05);
            color: white;
            font-family: inherit;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--accent-color);
        }

        .btn-gold {
            background: var(--accent-color);
            color: var(--primary-dark);
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 5px;
            transition: 0.3s;
            text-decoration: none;
            display: inline-block;
            width: 100%;
        }

        .btn-gold:hover {
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.3);
        }

        /* --- Guestbook --- */
        #guestbook-list {
            max-height: 400px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .guestbook-item {
            background: rgba(255,255,255,0.03);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 15px;
            font-size: 0.85rem;
            border: 1px solid var(--glass-border);
            text-align: left;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .guestbook-name {
            font-weight: 700;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .guestbook-status {
            font-size: 0.65rem;
            background: rgba(245, 158, 11, 0.15);
            color: var(--accent-color);
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 600;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        /* --- Navigation Menu --- */
        .nav-menu {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            padding: 10px 25px;
            border-radius: 50px;
            display: flex;
            gap: 25px;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .nav-menu a {
            color: white;
            opacity: 0.4;
            text-decoration: none;
            font-size: 1.2rem;
            transition: 0.3s;
        }

        .nav-menu a.active {
            opacity: 1;
            color: var(--accent-color);
        }

        .hidden {
            opacity: 0;
            visibility: hidden;
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <!-- Konfigurasi Template (EDIT DI SINI) -->
    <script>
        const TEMPLATE_CONFIG = {
            // Data Utama
            namaPanggilan: "Liam",
            namaLengkap: "Athear",
            ulangTahunKe: "5",
            tanggalSingkat: "24.05.26",
            labelBadge: "Perayaan Spesial",
            
            // Detail Acara
            hariTanggal: "Sabtu, 24 Mei 2026",
            waktu: "15:00 WIB - Selesai",
            namaLokasi: "The Glass House",
            alamatLengkap: "Jl. Menteng No. 12, Jakarta Pusat",
            linkMaps: "https://maps.google.com",
            
            // Galeri Foto (Ganti URL-nya saja)
            fotoHero: "https://images.unsplash.com/photo-1533174072545-7a4b6ad7a6c3?q=80&w=1000",
            fotoGallery: [
                "https://images.unsplash.com/photo-1530103862676-fa8c91abeead?q=80&w=500",
                "https://images.unsplash.com/photo-1513151233558-d860c5398176?q=80&w=500",
                "https://images.unsplash.com/photo-1472653431158-6364773b2a56?q=80&w=500",
                "https://images.unsplash.com/photo-1502086223501-7ea6ecd79368?q=80&w=500"
            ],

            // Hadiah Digital
            bank: "Bank Central Asia",
            noRekening: "1234567890",
            atasNama: "Orang Tua Liam",
            
            // Musik
            musikUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
            
            // Footer
            footerText: "EXCLUSIVE DESIGN BY REZA CREATIVE • 2026"
        };
    </script>

    <!-- Audio Element -->
    <audio id="bgMusic" loop preload="auto"></audio>

    <!-- Music Control -->
    <div class="music-control" id="musicControl" onclick="toggleMusic()">
        <div class="music-btn rotate" id="musicBtn">
            <i class="fas fa-compact-disc" id="musicIcon"></i>
        </div>
    </div>

    <!-- Unboxing Experience -->
    <div id="unboxing-overlay">
        <div class="envelope-wrapper" onclick="unlockInvitation()">
            <div class="envelope-icon">
                <i class="fas fa-envelope-open-text"></i>
            </div>
            <p id="label-buka" style="margin-top:20px; letter-spacing:4px; font-weight:300; font-size:0.75rem;">BUKA UNDANGAN</p>
        </div>
    </div>

    <!-- Navigasi -->
    <div class="nav-menu">
        <a href="#home" class="active"><i class="fas fa-home"></i></a>
        <a href="#event"><i class="fas fa-calendar-alt"></i></a>
        <a href="#gallery"><i class="fas fa-images"></i></a>
        <a href="#gift"><i class="fas fa-gift"></i></a>
        <a href="#rsvp"><i class="fas fa-check-circle"></i></a>
    </div>

    <!-- Konten Utama -->
    <div id="main-content" style="display:none;">
        
        <section id="home" class="hero">
            <div class="hero-badge" data-aos="fade-down" id="render-badge"></div>
            <h1 data-aos="zoom-in"><span id="render-panggilan"></span> <span class="highlight" id="render-lengkap"></span></h1>
            <p data-aos="fade-up" id="render-sub" style="letter-spacing: 5px; opacity:0.7; font-weight: 300;"></p>
        </section>

        <section id="event">
            <h2 class="section-title" data-aos="fade-up">Agenda Acara</h2>
            <div class="glass-card" data-aos="fade-up">
                <div class="event-box">
                    <h3>Hari & Tanggal</h3>
                    <p id="render-tgl"></p>
                </div>
                <div class="event-box">
                    <h3>Waktu Utama</h3>
                    <p id="render-waktu"></p>
                </div>
                <div class="event-box">
                    <h3>Lokasi</h3>
                    <p><strong id="render-lokasi"></strong><br><span id="render-alamat"></span></p>
                </div>
                <div style="text-align: center;">
                    <a id="render-link-maps" href="#" target="_blank" class="btn-gold" style="width: auto; padding: 12px 30px;">
                        <i class="fas fa-location-arrow"></i> Petunjuk Lokasi
                    </a>
                </div>
            </div>
        </section>

        <section id="gallery">
            <h2 class="section-title" data-aos="fade-up">Momen Indah</h2>
            <div class="glass-card" data-aos="fade-up">
                <div class="gallery-grid" id="render-gallery"></div>
            </div>
        </section>

        <section id="gift">
            <h2 class="section-title" data-aos="fade-up">Hadiah Digital</h2>
            <div class="glass-card" data-aos="fade-up">
                <p style="text-align:center; font-size:0.8rem; margin-bottom:20px; opacity:0.6;">
                    Kehadiran Anda adalah hadiah terbaik bagi kami. Namun bagi yang ingin mengirimkan tanda kasih:
                </p>
                <div class="gift-box">
                    <p style="font-weight: 700;" id="render-bank"></p>
                    <p id="render-rek" style="font-size: 1.2rem; letter-spacing: 2px; color: var(--accent-color);"></p>
                    <p style="font-size:0.7rem; opacity: 0.7;" id="render-an"></p>
                    <button class="btn-gold" style="width: auto;" onclick="copyRekening()">Salin Rekening</button>
                </div>
            </div>
        </section>

        <section id="rsvp">
            <h2 class="section-title" data-aos="fade-up">Konfirmasi & Doa</h2>
            <div class="glass-card" data-aos="fade-up">
                <p style="text-align:center; font-size:0.85rem; margin-bottom:25px; opacity:0.8;">
                    Mohon konfirmasi kehadiran Anda di bawah ini:
                </p>
                
                <div class="form-group">
                    <label>Nama Lengkap</label>
                    <input type="text" id="nameInput" class="form-control" placeholder="Masukkan nama Anda">
                </div>

                <div class="form-group">
                    <label>Konfirmasi Kehadiran</label>
                    <select id="attendanceInput" class="form-control" style="background: rgba(30, 41, 59, 0.9); color:white;">
                        <option value="Hadir">Saya Akan Hadir</option>
                        <option value="Ragu">Masih Ragu</option>
                        <option value="Tidak Hadir">Maaf, Tidak Bisa Hadir</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Pesan & Doa</label>
                    <textarea id="msgInput" class="form-control" style="height:80px;" placeholder="Tulis ucapan selamat..."></textarea>
                </div>

                <button class="btn-gold" onclick="submitRSVP()">Kirim Konfirmasi</button>

                <hr style="margin: 30px 0; border: 0; border-top: 1px solid var(--glass-border);">

                <div id="guestbook-list"></div>
            </div>
        </section>

        <footer id="render-footer" style="text-align:center; padding: 60px 0; opacity:0.2; font-size:0.6rem; letter-spacing: 2px;"></footer>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        // --- Template Engine ---
        function initTemplate() {
            const cfg = TEMPLATE_CONFIG;
            
            // Render Hero
            document.getElementById('render-badge').innerText = cfg.labelBadge;
            document.getElementById('render-panggilan').innerText = cfg.namaPanggilan;
            document.getElementById('render-lengkap').innerText = cfg.namaLengkap;
            document.getElementById('render-sub').innerText = `ULANG TAHUN KE-${cfg.ulangTahunKe} • ${cfg.tanggalSingkat}`;
            document.body.style.setProperty('--hero-img', `url('${cfg.fotoHero}')`);
            
            // Render Event
            document.getElementById('render-tgl').innerText = cfg.hariTanggal;
            document.getElementById('render-waktu').innerText = cfg.waktu;
            document.getElementById('render-lokasi').innerText = cfg.namaLokasi;
            document.getElementById('render-alamat').innerText = cfg.alamatLengkap;
            document.getElementById('render-link-maps').href = cfg.linkMaps;
            
            // Render Gallery
            const galleryContainer = document.getElementById('render-gallery');
            cfg.fotoGallery.forEach((url, i) => {
                const item = document.createElement('div');
                item.className = 'gallery-item';
                item.setAttribute('data-aos', 'zoom-in');
                item.setAttribute('data-aos-delay', i * 100);
                item.innerHTML = `<img src="${url}" alt="Gallery ${i}">`;
                galleryContainer.appendChild(item);
            });
            
            // Render Gift
            document.getElementById('render-bank').innerText = cfg.bank;
            document.getElementById('render-rek').innerText = cfg.noRekening;
            document.getElementById('render-an').innerText = `a.n ${cfg.atasNama}`;
            
            // Render Footer & Music
            document.getElementById('render-footer').innerText = cfg.footerText;
            document.getElementById('bgMusic').src = cfg.musikUrl;
        }

        // --- Logic Handlers ---
        const music = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('musicBtn');
        const musicIcon = document.getElementById('musicIcon');
        const musicControl = document.getElementById('musicControl');
        let isPlaying = false;

        async function unlockInvitation() {
            document.getElementById('unboxing-overlay').classList.add('hidden');
            setTimeout(async () => {
                document.getElementById('unboxing-overlay').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                musicControl.style.display = 'block';
                
                try {
                    await music.play();
                    isPlaying = true;
                } catch (err) {
                    isPlaying = false;
                    musicBtn.classList.remove('rotate');
                    musicIcon.classList.replace('fa-compact-disc', 'fa-play');
                }
                
                AOS.init({ duration: 1000, once: true });
                AOS.refresh();
            }, 1000);
        }

        async function toggleMusic() {
            try {
                if (isPlaying) {
                    music.pause();
                    musicBtn.classList.remove('rotate');
                    musicIcon.classList.replace('fa-compact-disc', 'fa-play');
                    isPlaying = false;
                } else {
                    await music.play();
                    musicBtn.classList.add('rotate');
                    musicIcon.classList.replace('fa-play', 'fa-compact-disc');
                    isPlaying = true;
                }
            } catch (err) { console.error(err); }
        }

        function copyRekening() {
            const temp = document.createElement('input');
            document.body.appendChild(temp);
            temp.value = TEMPLATE_CONFIG.noRekening;
            temp.select();
            document.execCommand('copy');
            document.body.removeChild(temp);
            showToast("Nomor Rekening Disalin!");
        }

        function showToast(text, isError = false) {
            const msg = document.createElement('div');
            msg.style = `position:fixed; top:20px; left:50%; transform:translateX(-50%); background:${isError ? '#ef4444' : 'var(--accent-color)'}; color:${isError ? 'white' : 'var(--primary-dark)'}; padding:10px 20px; border-radius:30px; z-index:3000; font-weight:700; font-size:0.8rem;`;
            msg.innerText = text;
            document.body.appendChild(msg);
            setTimeout(() => msg.remove(), 2500);
        }

        function submitRSVP() {
            const name = document.getElementById('nameInput').value;
            const status = document.getElementById('attendanceInput').value;
            const msg = document.getElementById('msgInput').value;

            if(!name || !msg) {
                showToast("Mohon lengkapi Nama dan Pesan.", true);
                return;
            }

            const container = document.getElementById('guestbook-list');
            const div = document.createElement('div');
            div.className = 'guestbook-item';
            div.innerHTML = `
                <div class="guestbook-name">
                    <span>${name}</span>
                    <span class="guestbook-status">${status}</span>
                </div>
                <p style="opacity:0.8; font-style:italic;">"${msg}"</p>
            `;
            container.prepend(div);
            document.getElementById('nameInput').value = '';
            document.getElementById('msgInput').value = '';
            showToast("Terimakasih konfirmasinya!");
        }

        // Jalankan Init saat window load
        window.onload = initTemplate;

        // Nav Active Observer
        window.onscroll = () => {
            document.querySelectorAll('section').forEach(sec => {
                let top = window.scrollY;
                let offset = sec.offsetTop - 150;
                let id = sec.getAttribute('id');
                if(top >= offset) {
                    document.querySelectorAll('.nav-menu a').forEach(links => {
                        links.classList.remove('active');
                        document.querySelector('.nav-menu a[href*=' + id + ']').classList.add('active');
                    });
                }
            });
        };
    </script>
</body>
</html>
